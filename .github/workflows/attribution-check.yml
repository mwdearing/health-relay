name: Attribution check

# Fails a pull request that shows tool/agent attribution in its title, body,
# commit messages or commit identities, or whose head branch is not
# <type>/<slug> (type: feature, bugfix, hotfix, docs, chore, refactor, ci, test)
# or a dependabot/ branch opened by Dependabot itself. Not a required check unless the ruleset says so.
#
# Runs on pull_request_target so the scanner always comes from the base branch,
# never from the pull request under test. The job checks out the base branch,
# only fetches the PR's commits as data and never executes anything from them.
# A PR that edits this workflow or the script is judged by the base versions.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request commits (data only)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"

      - name: Scan title, body, commits and branch name (base-branch scanner)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/attribution_check.py
