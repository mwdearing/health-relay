name: Signed beta upload

# HealthRelay fork: manual only. Archives, signs with automatic signing and an App Store Connect API key,
# and uploads the build to App Store Connect for beta testing (internal groups, and external groups once the app has passed beta review). The key, its ids and the team id live
# only in the protected `testflight` GitHub Environment (a reviewer approves each run) and are read only by
# the steps that need them. The bundle id is ALSO an environment secret (not an input), because a public repository
# shows workflow inputs and step environments in its logs; secrets are masked. The job runs only from `main`, and the
# environment must be restricted to the `main` branch in the repository settings. This workflow never runs on a pull
# request, never uploads an artifact, keeps xcodebuild output out of the public log and always removes the key file.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Marketing version to stamp; empty = the version recorded in component-versions.json (the build number is run number + 100)
        required: false
        default: ""
      configuration:
        description: Build configuration. AppStore has no iCloud Mailbox transport and is the one to submit for App Store review; Release keeps the beta transport
        type: choice
        options:
          - Release
          - AppStore
        default: Release

permissions:
  contents: read

concurrency:
  group: signed-beta
  cancel-in-progress: false

jobs:
  signed-beta:
    name: Signed archive and upload
    runs-on: macos-26
    environment: testflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/HealthBridgeCompanion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check the signing secrets and write the key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || fail "bundle_id has characters a bundle identifier cannot have"
          [[ -z "$MARKETING_VERSION" || "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || fail "marketing_version is not 1, 1.2 or 1.2.3"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "APPLE_TEAM_ID is not 10 letters or digits"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "ASC_KEY_ID is not 10 letters or digits"
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || fail "ASC_ISSUER_ID is not a UUID"
          [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is not a PEM private key"
          [[ "$ASC_KEY_P8" == *"END PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is cut short: no END line"
          # This repository's logs are public. xcodebuild prints its command-line build settings, so the container
          # id derived from the bundle id is masked before anything can print it.
          # BUNDLE_ID is a secret, so it is already masked; the container id derived from it is not.
          echo "::add-mask::iCloud.$BUNDLE_ID"
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      # A fresh runner holds no signing identity, so automatic signing would create a new development
      # certificate on every run, and the team reaches Apple's certificate limit after a handful of runs.
      # One stored development certificate is imported instead, into a keychain that exists only for this
      # run; the archive reuses it. The upload is still signed for distribution by App Store Connect.
      - name: Import the stored signing certificate into a temporary keychain
        env:
          SIGNING_CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "$SIGNING_CERT_P12_BASE64" ]] || fail "SIGNING_CERT_P12_BASE64 is not set in the environment"
          [[ -n "$SIGNING_CERT_PASSWORD" ]] || fail "SIGNING_CERT_PASSWORD is not set in the environment"
          umask 077
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$SIGNING_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12" || fail "SIGNING_CERT_P12_BASE64 is not base64"
          # A bundle written by OpenSSL 3 uses AES and a SHA-256 MAC, which the keychain import refuses with the
          # same message as a wrong password. Prove the password first, then re-wrap the bundle with the older
          # algorithms. The unwrapped copy is private to this user (umask 077) and removed in the same line.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:SIGNING_CERT_PASSWORD -noout > /dev/null 2>&1 || fail "SIGNING_CERT_PASSWORD does not open the stored certificate file"
          rewrap() { /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:SIGNING_CERT_PASSWORD -nodes -out "$RUNNER_TEMP/signing.pem" > /dev/null 2>&1 && /usr/bin/openssl pkcs12 -export -in "$RUNNER_TEMP/signing.pem" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -passout env:SIGNING_CERT_PASSWORD -out "$RUNNER_TEMP/signing-keychain.p12" > /dev/null 2>&1; }
          rewrap || { rm -f "$RUNNER_TEMP/signing.pem"; fail "the stored certificate file could not be re-wrapped for the keychain"; }
          rm -f "$RUNNER_TEMP/signing.pem"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1 || fail "the temporary keychain could not be created"
          security set-keychain-settings -lut 21600 "$KEYCHAIN" > /dev/null 2>&1
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1
          security import "$RUNNER_TEMP/signing-keychain.p12" -k "$KEYCHAIN" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null 2>&1 || fail "the keychain refused the stored certificate"
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-keychain.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null 2>&1 || fail "the imported key could not be opened to codesign"
          # Put the keychain first in the search list, keeping the runner's own after it.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"') > /dev/null 2>&1
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Development" || fail "the stored certificate is not a valid Apple Development identity with its private key"
          # An identity of another team would pass the check above, and Xcode would create a new certificate
          # for this team on every run after all. The certificate's organisational unit is its team.
          security find-certificate -c "Apple Development" -p "$KEYCHAIN" 2> /dev/null | openssl x509 -noout -subject 2> /dev/null | grep -q "OU *= *$APPLE_TEAM_ID\b" || fail "the stored certificate was not issued to this team"

      - name: Archive with automatic signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          [[ "$BUILD_CONFIGURATION" == "Release" || "$BUILD_CONFIGURATION" == "AppStore" ]] || { echo "::error::configuration must be Release or AppStore"; exit 1; }
          quiet() {
            local name="$1" log="$2"; shift 2
            if ! "$@" > "$log" 2>&1; then
              # The log is never printed: this repository's Actions log is public. Only a fixed category message
              # is printed, chosen by searching the file, so nothing from the file can reach the log.
              # xcodebuild echoes its command line and build settings (key path, team, version) at the top of the
              # log, so only its own error lines are searched, never the header.
              echo "::error::$name failed. Only fixed Apple error codes and categories are published."
              local errs
              errs=$(grep -iE '(^|[^[:alnum:]_])error:' "$log" || true)
              # Only fixed code patterns are printed (ITMS-nnnnnn and IDE distribution error names). They
              # come from Apple and carry no path, id or token, so nothing else from the file reaches the log.
              local codes
              codes=$(grep -oE 'ITMS-[0-9]{5,6}' "$log" | sort -u | head -10 || true)
              if [ -n "$codes" ]; then
                while IFS= read -r code; do
                  echo "::error::xcodebuild code: $code"
                done <<< "$codes"
              fi
              # Named distribution or App Store Connect errors are reported as a fixed message only.
              if grep -qE 'IDEDistribution|ASC[A-Za-z]*Error' "$log"; then
                echo "::error::xcodebuild reports a distribution or App Store Connect error (text not published)"
              fi
              probe() { if grep -qiE -- "$1" <<< "$errs"; then echo "::error::  category: $2"; fi; }
              probe '\.swift:[0-9]+(:[0-9]+)?: error:' "a Swift compile error"
              probe 'unable to authenticate|authentication credentials|authentication failed|status code:? ?40[13]' "the App Store Connect key was rejected"
              probe 'no signing certificate|signing certificate|no certificate|code signing identit' "a signing certificate problem"
              probe 'no profiles for|requires a provisioning profile|provisioning profile' "a provisioning profile problem"
              probe 'entitlement|capabilit' "an entitlement or capability mismatch"
              probe 'no account for team|requires a development team|no team' "a team or account problem"
              probe 'bundle identifier|bundle id' "a bundle identifier problem"
              probe 'build number|already been uploaded|version.*(already|must be higher)' "a version or build number problem"
              exit 1
            fi
          }
          if [[ -z "$MARKETING_VERSION" ]]; then
            MARKETING_VERSION=$(python3 -c "import json; print(json.load(open('../../component-versions.json'))['ios_companion']['marketing_version'])")
          fi
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          echo "Stamping version $MARKETING_VERSION build $BUILD_NUMBER"
          # The verification step compares the archive with the values stamped here.
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          quiet Archive "$RUNNER_TEMP/archive.log" xcodebuild archive \
            -project HealthBridgeCompanion.xcodeproj \
            -scheme HealthBridgeCompanion \
            -configuration "$BUILD_CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HealthRelay.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" \
            "MARKETING_VERSION=$MARKETING_VERSION" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "HEALTH_BRIDGE_SOURCE_COMMIT=$GITHUB_SHA" \
            "HEALTH_BRIDGE_ICLOUD_CONTAINER_IDENTIFIER=iCloud.$BUNDLE_ID"

      # Nothing else reads the archive before it goes to App Store Connect, where it may reach external testers or
      # App Store review. Compare it with what this run meant to build. Only pass or fail lines are printed (the
      # bundle id is a secret, so no value is echoed), plus the archive checksum for the record.
      - name: Verify the archive before upload
        env:
          BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
          BUILD_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -euo pipefail
          fail() { echo "::error::archive check failed: $1"; exit 1; }
          ARCHIVE="$RUNNER_TEMP/HealthRelay.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -type d | head -1)
          [[ -n "$APP" ]] || fail "no app bundle in the archive"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Info.plist" 2> /dev/null || true; }
          # An empty expected or archived value fails, so an unset secret and an unreadable key can't match.
          same() {
            local actual
            actual=$(plist "$1")
            [[ -n "$2" && -n "$actual" && "$actual" == "$2" ]] || fail "$3"
          }
          same CFBundleIdentifier "$BUNDLE_ID" "CFBundleIdentifier is not the bundle id"
          echo "ok: CFBundleIdentifier"
          same CFBundleShortVersionString "$MARKETING_VERSION" "CFBundleShortVersionString is not the marketing version"
          echo "ok: CFBundleShortVersionString"
          same CFBundleVersion "$BUILD_NUMBER" "CFBundleVersion is not the build number"
          echo "ok: CFBundleVersion"
          same HealthBridgeSourceCommit "$GITHUB_SHA" "HealthBridgeSourceCommit is not this commit"
          echo "ok: HealthBridgeSourceCommit"
          codesign --verify --strict "$APP" > /dev/null 2>&1 || fail "the app signature does not verify"
          echo "ok: codesign --verify --strict"
          ENTITLEMENTS=$(codesign -d --entitlements :- "$APP" 2> /dev/null || true)
          [[ "$ENTITLEMENTS" == *"com.apple.developer.healthkit"* ]] || fail "the HealthKit entitlement is missing"
          echo "ok: HealthKit entitlement"
          if [[ "$BUILD_CONFIGURATION" == "AppStore" ]]; then
            [[ "$ENTITLEMENTS" != *"com.apple.developer.icloud-"* ]] || fail "the AppStore archive carries an iCloud entitlement"
            echo "ok: no iCloud entitlement in the AppStore archive"
          fi
          EXECUTABLE="$APP/$(plist CFBundleExecutable)"
          SUM=$(shasum -a 256 "$EXECUTABLE" | cut -d' ' -f1)
          echo "ok: archived executable SHA-256 $SUM"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          quiet() {
            local name="$1" log="$2"; shift 2
            if ! "$@" > "$log" 2>&1; then
              # The log is never printed: this repository's Actions log is public. Only a fixed category message
              # is printed, chosen by searching the file, so nothing from the file can reach the log.
              # xcodebuild echoes its command line and build settings (key path, team, version) at the top of the
              # log, so only its own error lines are searched, never the header.
              echo "::error::$name failed. Only fixed Apple error codes and categories are published."
              local errs
              errs=$(grep -iE '(^|[^[:alnum:]_])error:' "$log" || true)
              # Only fixed code patterns are printed (ITMS-nnnnnn and IDE distribution error names). They
              # come from Apple and carry no path, id or token, so nothing else from the file reaches the log.
              local codes
              codes=$(grep -oE 'ITMS-[0-9]{5,6}' "$log" | sort -u | head -10 || true)
              if [ -n "$codes" ]; then
                while IFS= read -r code; do
                  echo "::error::xcodebuild code: $code"
                done <<< "$codes"
              fi
              # Named distribution or App Store Connect errors are reported as a fixed message only.
              if grep -qE 'IDEDistribution|ASC[A-Za-z]*Error' "$log"; then
                echo "::error::xcodebuild reports a distribution or App Store Connect error (text not published)"
              fi
              probe() { if grep -qiE -- "$1" <<< "$errs"; then echo "::error::  category: $2"; fi; }
              probe '\.swift:[0-9]+(:[0-9]+)?: error:' "a Swift compile error"
              probe 'unable to authenticate|authentication credentials|authentication failed|status code:? ?40[13]' "the App Store Connect key was rejected"
              probe 'no signing certificate|signing certificate|no certificate|code signing identit' "a signing certificate problem"
              probe 'no profiles for|requires a provisioning profile|provisioning profile' "a provisioning profile problem"
              probe 'entitlement|capabilit' "an entitlement or capability mismatch"
              probe 'no account for team|requires a development team|no team' "a team or account problem"
              probe 'bundle identifier|bundle id' "a bundle identifier problem"
              probe 'build number|already been uploaded|version.*(already|must be higher)' "a version or build number problem"
              exit 1
            fi
          }
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <false/>
          </dict>
          </plist>
          PLIST
          quiet Export "$RUNNER_TEMP/export.log" xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HealthRelay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key file and the temporary keychain
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/asc/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist" "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log" "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-keychain.p12" "$RUNNER_TEMP/signing.pem"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" > /dev/null 2>&1 || true
