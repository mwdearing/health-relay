name: iOS CI

# HealthRelay fork: runs on pull requests targeting main (branch protection required
# check) and on manual/tag dispatch (2026-09-28).
on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "ios-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift tests and unsigned app builds
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios/HealthBridgeCompanion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run Swift package tests
        run: swift test

      - name: Resolve Xcode project package dependencies
        # HealthRelay addition (ZIPFoundation, the export-lab-results importer): a plain
        # `xcodebuild -project ... -target ... build` never runs SPM resolution -- that
        # only happens for a `-resolvePackageDependencies` action or an actual `-scheme`
        # build. Without this step the target build fails with "couldn't be opened
        # because there is no such file" for the package module and its resource bundle.
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HealthBridgeCompanion.xcodeproj

      - name: Build unsigned iPhone simulator app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned generic iPhone app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanion \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned Public Documents QA simulator app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanionPublicDocumentsQA \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build unsigned Public Documents QA generic iPhone app
        run: |
          xcodebuild -project HealthBridgeCompanion.xcodeproj \
            -target HealthBridgeCompanionPublicDocumentsQA \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
