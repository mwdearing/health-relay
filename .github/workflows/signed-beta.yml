name: Signed beta upload

# HealthRelay fork: manual only. Archives, signs with automatic signing and an App Store Connect API key,
# and uploads the build to App Store Connect for INTERNAL beta testing. The key, its ids and the team id live
# only in the protected `testflight` GitHub Environment (a reviewer approves each run) and are read only by
# the steps that need them. The bundle id is a dispatch input so the tracked project keeps its public-neutral
# placeholder. This workflow never runs on a pull request, never uploads an artifact, and always removes the key file.

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier of the registered App ID
        required: true
      marketing_version:
        description: Marketing version to stamp; empty = 1.2.<workflow run number> (build number = run number + 100)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: signed-beta
  cancel-in-progress: false

jobs:
  signed-beta:
    name: Signed archive and upload
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/HealthBridgeCompanion
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check the signing secrets and write the key file
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || fail "bundle_id has characters a bundle identifier cannot have"
          [[ -z "$MARKETING_VERSION" || "$MARKETING_VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || fail "marketing_version is not 1, 1.2 or 1.2.3"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "APPLE_TEAM_ID is not 10 letters or digits"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || fail "ASC_KEY_ID is not 10 letters or digits"
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || fail "ASC_ISSUER_ID is not a UUID"
          [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is not a PEM private key"
          [[ "$ASC_KEY_P8" == *"END PRIVATE KEY"* ]] || fail "ASC_KEY_P8 is cut short: no END line"
          # This repository's logs are public. xcodebuild prints its command-line build settings, so the real
          # bundle id (and the container id derived from it) is masked before anything else can print it.
          echo "::add-mask::$BUNDLE_ID"
          echo "::add-mask::iCloud.$BUNDLE_ID"
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"

      - name: Archive with automatic signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail
          MARKETING_VERSION="${MARKETING_VERSION:-1.2.$GITHUB_RUN_NUMBER}"
          BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))
          echo "Stamping version $MARKETING_VERSION build $BUILD_NUMBER"
          xcodebuild archive \
            -project HealthBridgeCompanion.xcodeproj \
            -scheme HealthBridgeCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HealthRelay.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID" \
            "MARKETING_VERSION=$MARKETING_VERSION" \
            "CURRENT_PROJECT_VERSION=$BUILD_NUMBER" \
            "HEALTH_BRIDGE_SOURCE_COMMIT=$GITHUB_SHA" \
            "HEALTH_BRIDGE_ICLOUD_CONTAINER_IDENTIFIER=iCloud.$BUNDLE_ID"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>testFlightInternalTestingOnly</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HealthRelay.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/asc/AuthKey.p8" "$RUNNER_TEMP/ExportOptions.plist"
